[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-engineering-job-crawler"
version = "0.1.0"
description = "Daily engineering job crawler with Telegram notifications"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-mock>=3.14,<4",
    "responses>=0.25,<1",
]

[tool.setuptools]
py-modules = ["exceptions", "job_filter", "main", "models", "notifier", "state_manager", "summarizer"]

[tool.setuptools.packages.find]
include = ["scrapers*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: opt-in tests that call paid external services",
]
